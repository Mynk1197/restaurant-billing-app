<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS doesn't read the web manifest for its home-screen icon --
         needs this explicit tag instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black-translucent" turned out to not just overlay the status bar --
         it seems to genuinely shrink the WebView's real height by the
         status bar's height in this app's standalone mode, and that
         missing height reappeared as a persistent gap at the *bottom* of
         the screen that no amount of CSS (fixed+inset-0, even pinning body
         itself) could compensate for, since the WebView itself was
         shorter than the physical screen. "default" sizes the WebView
         correctly -- its only downside is a cosmetic top-color mismatch
         on the dark Login screen, which is a far smaller problem than a
         layout bug that can't be fixed from CSS at all. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Restaurant Billing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
