<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS doesn't read the web manifest for its home-screen icon --
         needs this explicit tag instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black-translucent" overlays a transparent status bar on top of the
         page content instead of reserving space for it, which requires
         manually padding for safe-area-inset-top everywhere -- nothing in
         this app does that, so it caused every header to sit underneath
         the iPhone's status bar (time/battery). "default" makes iOS
         reserve its own space instead, avoiding that without needing any
         safe-area padding. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Restaurant Billing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
